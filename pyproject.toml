[project]
name = "tg-auto"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "apscheduler>=3.11.3",
    "python-dotenv>=1.2.3",
    "telethon>=1.45.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

# ===== pytest 配置块（写在pyproject里，替代pytest.ini）=====
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"
markers = [
  "slow: marks tests as slow",
  "integration: integration tests",
]
filterwarnings = [
  "ignore::DeprecationWarning",
]
